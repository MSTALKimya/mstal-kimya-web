# Netlify yayın ayarları — derleme adımı yok, site olduğu gibi yayınlanır
[build]
  publish = "."
  command = ""

# İçerik dosyaları her zaman güncel okunsun (yeni duyuru hemen görünsün)
[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache"
