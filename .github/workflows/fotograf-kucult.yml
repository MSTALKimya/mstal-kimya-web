# Yönetim panelinden yüklenen büyük fotoğrafları (telefon fotoğrafları 4-8 MB olabilir)
# otomatik olarak en fazla 2000 piksele küçültür ve sıkıştırır. Site hızlı açılır.
name: Fotoğrafları küçült

on:
  push:
    branches: [main]
    paths: ["images/uploads/**"]

permissions:
  contents: write

concurrency:
  group: fotograf-kucult
  cancel-in-progress: false

jobs:
  kucult:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ImageMagick kur
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick > /dev/null

      - name: Yeni yüklenen fotoğrafları küçült
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            files=$(git ls-files 'images/uploads/*')
          else
            files=$(git diff --name-only --diff-filter=AM "$BEFORE" "$GITHUB_SHA" -- 'images/uploads/')
          fi
          echo "$files" | while IFS= read -r f; do
            case "${f,,}" in
              *.jpg|*.jpeg|*.png|*.webp) ;;
              *) continue ;;
            esac
            [ -f "$f" ] || continue
            size=$(stat -c%s "$f")
            if [ "$size" -gt 350000 ]; then
              echo "Küçültülüyor: $f ($((size / 1024)) KB)"
              mogrify -auto-orient -resize '2000x2000>' -strip -quality 82 "$f"
              echo "  -> $(( $(stat -c%s "$f") / 1024 )) KB"
            fi
          done

      - name: Küçültülen fotoğrafları kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/uploads
          if git diff --cached --quiet; then
            echo "Küçültülecek fotoğraf yok."
          else
            git commit -m "Fotoğraflar otomatik küçültüldü"
            git pull --rebase origin main
            git push
          fi
